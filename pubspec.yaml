name: moovly
description: Moovly - Smart Mobility App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  animate_do: ^3.3.4
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  cloud_firestore: ^6.8.0
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.14.0
  flutter_svg: ^2.2.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  flutter_local_notifications: ^19.4.0
  
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.2
    
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mobile_scanner: ^7.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Bold.ttf